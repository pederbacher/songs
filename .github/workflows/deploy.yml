name: Build & deploy songs

# Rebuilds the HTML whenever a song source, function, template or the
# build script changes (e.g. an edit committed from the in-browser editor),
# then publishes output_html/ to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - "songs/**"
      - "functions/**"
      - "templates/**"
      - "make-html.R"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer commit cancel an in-progress build instead of queueing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Generate HTML
        env:
          # Skip the server.py + Firefox launch in make-html.R (headless CI).
          SANGE_NO_SERVER_RESTART: "1"
        run: Rscript make-html.R

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output_html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
