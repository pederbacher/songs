<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SongName</title>

    <!-- Song metadata (speed, etc.) parsed from # key=value lines in the .txt source -->
    <script>window.SONG_META = SongMetaJSON;</script>

    <!-- Link your CSS and JS files -->
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>

    <!-- Floating master controls (no fold button anymore) -->
    <div id="controls" class="fullyHidden">
      <!-- Scroll controls (control both panes in split mode) -->
      <button id="startstop" type="button" onclick="startstop()">Start</button>
      <button id="faster" class="speed-btn" type="button">+</button>
      <button id="slower" class="speed-btn" type="button">-</button>

      <!-- Chords, TOC, Split in first row -->
      <button id="toggleChords" class="only-single" type="button" onclick="hideshowchords()">ChordsHide</button>
      <button id="toc-btn" class="speed-btn" type="button" onclick="window.location.href='index.html'">TOC</button>
      <button id="splitToggle" type="button">Split</button>
      <div id="editButtons" class="only-single">
        <button type="button" onclick="openEditor()">Edit</button>
        <button type="button" onclick="newSong()">New</button>
        <button id="rebuildBtn" type="button" onclick="rebuildHtml()">Rebuild</button>
      </div>

      <!-- Transpose buttons (only in single mode) — second row -->
      <div id="transposeButtons" class="only-single">
        <button type="button" onclick="showGroup(0)">0</button>
        <button type="button" onclick="showGroup(1)">1</button>
        <button type="button" onclick="showGroup(2)">2</button>
        <button type="button" onclick="showGroup(3)">3</button>
        <button type="button" onclick="showGroup(4)">4</button>
        <button type="button" onclick="showGroup(5)">5</button>
        <button type="button" onclick="showGroup(6)">6</button>
        <button type="button" onclick="showGroup(7)">7</button>
        <button type="button" onclick="showGroup(8)">8</button>
        <button type="button" onclick="showGroup(9)">9</button>
        <button type="button" onclick="showGroup(10)">10</button>
        <button type="button" onclick="showGroup(11)">11</button>
      </div>

      <!-- Visible only in split mode: TOTAL width controls for the split area -->
      <button id="narrower" class="only-split" type="button">-width</button>
      <button id="wider"   class="only-split" type="button">+width</button>
    </div>

    <!-- Main page content (this will be cloned into split panes) -->
    <div id="pageContent">
      <h1>SongTitle</h1>

      <!--
        Put your full song content here.
        Use .chordline and no0..no11 classes for transposed chord lines.
        Example:
        <div class="chordline no0">Am     Dm     G     C</div>
      -->
      <pre>
SongContent
      </pre>
    </div>

    <!-- Speed indicator toast -->
    <div id="speedIndicator"></div>

    <!-- Song editor overlay -->
    <div id="editorOverlay">
      <div id="editorBox">
        <h2 id="editorTitle">Edit song</h2>
        <textarea id="editorTextarea" spellcheck="false"></textarea>
        <div id="editorStatus"></div>
        <div id="editorButtons">
          <button type="button" onclick="saveEditor(true)">Save and close</button>
          <button type="button" onclick="closeEditor()">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Split container is created dynamically after #pageContent -->

  </body>
</html>
